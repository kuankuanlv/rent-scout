# ============================================================
# rent-scout 配置文件（公开部分）
#   敏感配置见 config.env.local.toml（不入库）
#   筛选规则在 /admin 页面管理，不在此文件
#   所有配置 10s 内热加载生效，改完不用重启
# ============================================================

# ---------- 常规 General（服务运行基础，一般不用改） ----------

[server]
addr = ":7777"            # HTTP 监听地址（admin 页面 / API）

[log]
level = "info"            # 日志级别：debug / info / warn / error
format = "text"           # 日志格式：text / json
path = ""                 # 日志文件路径（空 = 输出到 stdout，配了则按 50MB×5 轮转）

[pipeline]                # 模块间组批协议（filter/notifier 消费通用）
batch_size = 20           # 组批大小：积压达到此数立即处理
linger_interval = 120     # 兜底等待（秒）：积压不足时最长等多久处理一次

# ---------- 收集 Collector（信息源，改城市/加源看这里） ----------

[collector]
sources = ["douban"]      # 启用的源列表：douban / 新增适配器名
interval = 1800           # 采集间隔（秒），全局默认；每源可覆盖
jitter_ratio = 0.2        # 间隔随机抖动比例（0~0.5），防固定规律被网站检测

[collector.douban]
groups = [                # 豆瓣租房小组 URL（内置北京热门小组，换城市就替换成对应小组）
    "https://www.douban.com/group/35417/discussion",
    "https://www.douban.com/group/262626/discussion",
    "https://www.douban.com/group/232413/discussion",
    "https://www.douban.com/group/338147/discussion",
    "https://www.douban.com/group/331294/discussion",
    "https://www.douban.com/group/550436/discussion",
    "https://www.douban.com/group/596202/discussion",
]
interval = 1800           # 覆盖全局采集间隔（可选，高频源可单独调快）

# ---------- 过滤 Filter（AI 筛选开关与效率，一般不用改） ----------

[filter]
ai_enabled = true         # 是否启用 AI 规则链；未配 LLM key 时自动跳过（WARN 提示）
ai_batch_size = 10        # AI 凑批大小：一次 LLM 调用判定的帖子数（越小越准越贵）
trim_limits = { douban = 800 }  # 每源 LLM 输入截断字数（缺省 500），省 token 提准确率

# ---------- 通知 Notify（发送行为，一般不用改） ----------

[notifier]
max_attempts = 3          # 单渠道失败重试次数（超过进死信，/admin 可人工重发）
retry_base_interval = 300 # 重试退避基础间隔（秒）
# 渠道启用遵循"约定大于配置"：config.env.local.toml 里配了 webhook 的渠道自动启用
# 如需精确控制只启用部分渠道，取消下行注释并列出渠道名：
# channels = ["feishu", "dingtalk"]

# ---------- 管理 Admin（内部页面/API 鉴权；Docker 部署务必开启！） ----------

[admin]
auth_required = false     # 是否启用鉴权；false=默认不鉴权，/admin 与 /api 对网络可见（有风险！）
token = ""                # 访问口令；auth_required=true 且为空时启动随机生成并打印到日志（重启后失效）
