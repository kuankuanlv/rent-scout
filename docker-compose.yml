version: '3.8'

services:
  rent-scout:
    build: .
    image: rent-scout:latest
    container_name: rent-scout
    restart: unless-stopped
    ports:
      - "7777:7777"
    environment:
      - DB_PATH=/app/db/rent-scout.db
    volumes:
      - ./data:/app/db
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
