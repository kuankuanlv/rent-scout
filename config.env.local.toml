# ============================================================
# rent-scout 敏感配置（不入库，gitignore）
#   按需填写；没配的渠道/能力自动关闭
# ============================================================

# ---------- 常规 General ----------

# ---------- 收集 Collector（登录 cookie，豆瓣可选） ----------

[collector.douban]
cookie_mode = "none"      # cookie 来源：none(匿名) / file(本地文件) / cookiecloud
cookie_file = "db/cookies/douban.txt"  # cookie_mode=file 时读取的 cookie 文件（手动导出/脚本更新）
cookiecloud_url = ""      # CookieCloud 服务地址（cookie_mode=cookiecloud 时使用）
cookiecloud_key = ""
cookiecloud_password = ""

# ---------- 过滤 Filter（AI 筛选，配了 key 才生效） ----------

[filter.llm]              # 兼容 OpenAI 接口
api_key = ""              # LLM 服务商 key（留空则 AI 规则链自动关闭）
base_url = ""             # 接口地址，默认 https://api.openai.com/v1
model = ""                # 默认模型（如 deepseek-chat）
fallback_models = []      # 按序 fallback 的备用模型（429/5xx 自动切换）

# ---------- 通知 Notify（配了 webhook 的渠道自动启用） ----------

[notifier.feishu]
webhook = ""              # 飞书机器人 webhook 地址

[notifier.dingtalk]
webhook = ""              # 钉钉机器人 webhook 地址
secret = ""               # 加签密钥（机器人开启加签时填写）

[notifier.wecom]
webhook = ""              # 企业微信群机器人 webhook 地址

[notifier.pushplus]
token = ""                # pushplus token（微信推送）

[notifier.serverchan]
sendkey = ""              # Server酱 sendkey（微信推送）

[notifier.webhook]
url = ""                  # 自定义 webhook 地址
template = ""             # 自定义 JSON 模板（可选，缺省发送全字段）
